<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Finder</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>Reaction Finder</h1>
            <button class="add-image-btn" id="add-image-btn">+ Add Image</button>
        </header>

        <div class="chat-messages" id="chat-messages">
            <div class="message system">
                Type a prompt to get a reaction image!
            </div>
        </div>

        <form class="chat-input" id="chat-form">
            <input
                type="text"
                id="prompt-input"
                placeholder="Describe the reaction you want..."
                autocomplete="off"
                required
            >
            <button type="submit">Send</button>
        </form>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="upload-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>Add Reaction Image</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>

            <!-- Step 1: Upload -->
            <div class="modal-step" id="step-upload">
                <div class="upload-area" id="upload-area">
                    <input type="file" id="file-input" accept=".jpg,.jpeg,.png,.gif,.webp" hidden>
                    <div class="upload-icon">+</div>
                    <p>Click or drag an image here</p>
                    <p class="upload-hint">JPEG, PNG, GIF, WebP - Max 10MB</p>
                </div>
            </div>

            <!-- Step 2: Preview & Edit Metadata -->
            <div class="modal-step" id="step-preview" style="display: none;">
                <div class="preview-container">
                    <img id="preview-image" alt="Preview">
                </div>
                <div class="metadata-form">
                    <div class="form-group">
                        <label for="edit-description">Description</label>
                        <textarea id="edit-description" rows="3" placeholder="Describe the reaction..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="edit-tags">Tags (comma-separated)</label>
                        <input type="text" id="edit-tags" placeholder="emotion, source, action">
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="btn-secondary" id="btn-back">Back</button>
                    <button class="btn-primary" id="btn-save">Save Image</button>
                </div>
            </div>

            <!-- Loading State -->
            <div class="modal-step" id="step-loading" style="display: none;">
                <div class="loading-spinner"></div>
                <p>Analyzing image and generating metadata...</p>
                <p class="loading-hint">This may take a minute with local models</p>
                <button class="btn-secondary" id="btn-cancel">Cancel</button>
            </div>

            <!-- Success State -->
            <div class="modal-step" id="step-success" style="display: none;">
                <div class="success-icon">&#10003;</div>
                <p>Image added successfully!</p>
                <button class="btn-primary" id="btn-done">Done</button>
            </div>

            <!-- Error State -->
            <div class="modal-step" id="step-error" style="display: none;">
                <div class="error-icon">!</div>
                <p id="error-message">Upload failed</p>
                <button class="btn-secondary" id="btn-retry">Try Again</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
